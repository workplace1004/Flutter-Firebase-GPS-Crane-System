name: grua_core
description: >-
  Shared domain layer for Grúa RD: models, repositories, Firestore paths,
  theme, localization and dependency wiring used by all three apps.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_database: ^12.5.0
  firebase_storage: ^13.5.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  firebase_app_check: ^0.4.7
  cloud_functions: ^6.4.0
  firebase_crashlytics: ^5.3.0
  firebase_remote_config: ^6.6.0
  firebase_analytics: ^12.5.0

  # State + routing
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  go_router: ^18.0.1

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Maps and location. These live in core because all three products draw the
  # same map with the same markers, and the driver and client apps must agree
  # on exactly what "permission granted" means.
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_polyline_points: ^3.1.0
  # Routes API calls for the chofer's road route to a pickup.
  http: ^1.2.0

  # Photos: the chofer's paperwork, and what either side attaches to a chat.
  # Here rather than in each app because the chat screen is shared.
  image_picker: ^1.2.3

  # Opens a chat photo in the platform's viewer, where saving it is one tap.
  url_launcher: ^6.3.2

  # Utilities
  intl: ^0.20.3
  collection: ^1.19.1
  logging: ^1.3.0
  livekit_client: ^2.12.0

dev_dependencies:
  # The in-memory backend the tests run against.
  grua_testing:
    path: ../grua_testing
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  # Must stay >=4. Freezed 3.x puts a "final" modifier on generated constructor
  # parameters, which the Dart 3.13 front-end rejects. The analyzer still
  # accepts it, so downgrading looks fine under "dart analyze" and only breaks
  # at "flutter test" / "flutter build" time.
  freezed: ^4.0.1
  json_serializable: ^6.11.2
  riverpod_generator: ^4.0.0+1
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    # The brand mark ships with the package rather than each app, so all three
    # products draw the same logo without re-declaring the asset.
    - assets/icons/
