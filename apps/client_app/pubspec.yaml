name: client_app
description: "Grúas RD 24/7 — app del cliente."
publish_to: none
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  grua_core:
    path: ../../packages/grua_core

  # State and routing are used directly by screens in every app.
  flutter_riverpod: ^3.1.0
  go_router: ^18.0.1

  # Maps + location
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_polyline_points: ^3.1.0

  # The nearby-truck search reads time through this so tests can move it.
  clock: ^1.1.1

  # UI + platform
  cupertino_icons: ^1.0.9
  flutter_local_notifications: ^22.3.0
  permission_handler: ^13.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  shared_preferences: ^2.5.5
  wakelock_plus: ^1.8.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0

dev_dependencies:
  # The in-memory backend the tests run against.
  grua_testing:
    path: ../../packages/grua_testing
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  intl: ^0.20.3
  very_good_analysis: ^11.0.0
  build_runner: ^2.15.1
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

# The launcher icon, generated from the company logo:
#   flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/logo_icon.jpeg
  min_sdk_android: 24
  remove_alpha_ios: true
  # Android 8+ draws its own shape around the icon: the logo sits on the blue
  # it is drawn on, inset so the mask cannot cut into the lettering.
  adaptive_icon_background: "#1B4FD8"
  adaptive_icon_foreground: assets/logo_icon.jpeg
  adaptive_icon_foreground_inset: 18
