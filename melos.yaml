name: grua_rd

packages:
  - packages/**
  - apps/**

command:
  bootstrap:
    environment:
      sdk: ^3.13.0

scripts:
  analyze:
    description: Static analysis across every package.
    run: dart analyze --fatal-infos .

  format:
    description: Format all Dart sources.
    run: dart format --line-length 100 packages apps

  format:check:
    description: Fail if anything is unformatted.
    run: dart format --line-length 100 --set-exit-if-changed packages apps

  gen:
    description: Run build_runner across packages that need codegen.
    run: dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      dependsOn: build_runner

  gen:watch:
    description: Watch mode for codegen.
    run: dart run build_runner watch --delete-conflicting-outputs
    packageFilters:
      scope: grua_core

  test:
    description: Run every Dart/Flutter test suite.
    run: flutter test
    packageFilters:
      dirExists: test

  test:functions:
    description: Run the Cloud Functions test suite against the emulators.
    run: npm --prefix functions test

  emulators:
    description: Start the Firebase emulator suite.
    run: firebase emulators:start --import=.emulator-data --export-on-exit

  # --flavor is deliberately absent. Gradle product flavors land with the
  # Firebase projects, since their only job is to point each build at a
  # different one; until then a flavor argument would just fail the build.

  run:client:
    description: Run the customer app in Chrome.
    run: flutter run -d chrome --dart-define-from-file=../../config/dev.json
    packageFilters:
      scope: client_app

  # Fixed for the same reason as the panel below, and one more: the browser
  # remembers the location permission per origin, so a new random port would
  # ask the chofer for it again on every launch.
  run:driver:
    description: Run the chofer app in Chrome.
    run: flutter run -d chrome --web-port 50166 --dart-define-from-file=../../config/dev.json
    packageFilters:
      scope: driver_app

  # A fixed port, because the browser Maps key only accepts listed referrers
  # and `flutter run` otherwise picks a random one every launch.
  run:admin:
    description: Run the operations panel in Chrome.
    run: flutter run -d chrome --web-port 5000 --dart-define-from-file=../../config/dev.json
    packageFilters:
      scope: admin_web
